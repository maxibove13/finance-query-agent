description: >
  Personal finance database tracking bank account and credit card transactions,
  categorized by tags, with multi-currency support (USD, UYU).
  Includes historical exchange rates for currency conversion.

tables:
  - name: accounts
    description: Bank accounts owned by users. Each account has a single currency.
    dimensions:
      - name: id
        description: Primary key
        data_type: integer
      - name: user_id
        description: Owner of the account (used for RLS — do NOT filter by this)
        data_type: integer
        access: private
      - name: alias
        description: Human-readable account name
        data_type: "varchar(255)"
        synonyms: [name, account_name, label]
      - name: currency
        description: ISO 4217 currency code
        data_type: "varchar(3)"
        is_enum: true
        sample_values: [USD, UYU]

  - name: account_movements
    description: >
      Bank account transactions (debits and credits). Join to accounts for
      currency and account name. Join to tags for category name.
    dimensions:
      - name: id
        description: Primary key
        data_type: integer
      - name: account_id
        description: FK to accounts.id
        data_type: integer
      - name: category_id
        description: FK to tags.id (nullable — uncategorized transactions)
        data_type: integer
        nullable: true
      - name: description
        description: Merchant or transaction description
        data_type: text
        synonyms: [merchant, payee, vendor]
      - name: movement_direction
        description: "'DEBIT' = expense/outflow, 'CREDIT' = income/inflow"
        data_type: "varchar(10)"
        is_enum: true
        sample_values: [DEBIT, CREDIT]
    time_dimensions:
      - name: issued_at
        description: Date the transaction occurred
        data_type: date
        synonyms: [date, transaction_date, when]
    facts:
      - name: amount
        description: Transaction amount (always positive; direction from movement_direction)
        data_type: "numeric(15,2)"
        synonyms: [value, total]
      - name: balance
        description: Account balance after this transaction (nullable)
        data_type: "numeric(15,2)"
        nullable: true
        non_additive: true
    metrics:
      - name: total_expenses
        expr: SUM(amount)
        filter:
          expr: "movement_direction = 'DEBIT'"
        description: Sum of all expense (debit) amounts
      - name: total_income
        expr: SUM(amount)
        filter:
          expr: "movement_direction = 'CREDIT'"
        description: Sum of all income (credit) amounts
      - name: transaction_count
        expr: COUNT(*)
        description: Number of transactions

  - name: credit_card_movements
    description: >
      Credit card transactions. Join to tags for category name.
      Each transaction has its own currency column.
    dimensions:
      - name: id
        description: Primary key
        data_type: integer
      - name: category_id
        description: FK to tags.id (nullable)
        data_type: integer
        nullable: true
      - name: description
        description: Merchant or transaction description
        data_type: text
        synonyms: [merchant, payee, vendor]
      - name: movement_direction
        description: "'DEBIT' = expense/outflow, 'CREDIT' = income/inflow"
        data_type: "varchar(10)"
        is_enum: true
        sample_values: [DEBIT, CREDIT]
      - name: currency
        description: Currency of this specific transaction
        data_type: "varchar(3)"
        is_enum: true
        sample_values: [USD]
    time_dimensions:
      - name: issued_at
        description: Date the transaction occurred
        data_type: date
        synonyms: [date, transaction_date, when]
    facts:
      - name: amount
        description: Transaction amount (always positive; direction from movement_direction)
        data_type: "numeric(15,2)"
        synonyms: [value, total]

  - name: tags
    description: >
      Category taxonomy for transactions. Shared reference data (not user-scoped).
      Join to account_movements or credit_card_movements via category_id.
    dimensions:
      - name: id
        description: Primary key
        data_type: integer
      - name: name
        description: Category name
        data_type: "varchar(100)"
        synonyms: [category, tag, label]
        is_enum: true
        sample_values: [Supermercado, Transporte, Restaurantes, Salud, Suscripciones, Entretenimiento]

  - name: historical_exchange_rates
    description: >
      Daily exchange rates from USD to other currencies. Use this table to convert
      transaction amounts between currencies. Source currency is always USD.
    dimensions:
      - name: source_currency
        description: Source currency (always 'USD')
        data_type: "varchar(3)"
        is_enum: true
        sample_values: [USD]
      - name: target_currency
        description: Target currency code
        data_type: "varchar(3)"
        is_enum: true
        sample_values: [USD, UYU, ARS, BRL, EUR]
    time_dimensions:
      - name: rated_on
        description: Date of the exchange rate
        data_type: date
        synonyms: [rate_date, date]
    facts:
      - name: rate
        description: "Exchange rate: 1 USD = <rate> <target_currency>"
        data_type: float
        synonyms: [exchange_rate]
      - name: min_rate
        description: Minimum rate within a ±6 month window (for volatility context)
        data_type: float
        nullable: true
      - name: max_rate
        description: Maximum rate within a ±6 month window (for volatility context)
        data_type: float
        nullable: true

  - name: latest_exchange_rates_mv
    description: >
      Most recent exchange rate per target currency (source is always USD,
      same as historical_exchange_rates). Use as fallback when
      historical_exchange_rates has no row for the exact transaction date.
    dimensions:
      - name: target_currency
        description: Target currency code
        data_type: "varchar(3)"
        is_enum: true
        sample_values: [USD, UYU, ARS, BRL, EUR]
    time_dimensions:
      - name: rated_on
        description: Date of the most recent rate
        data_type: date
    facts:
      - name: rate
        description: "Latest exchange rate: 1 USD = <rate> <target_currency>"
        data_type: float

relationships:
  - left_table: account_movements
    right_table: accounts
    join_type: inner
    relationship_columns:
      - left_column: account_id
        right_column: id
  - left_table: account_movements
    right_table: tags
    join_type: left
    relationship_columns:
      - left_column: category_id
        right_column: id
  - left_table: credit_card_movements
    right_table: tags
    join_type: left
    relationship_columns:
      - left_column: category_id
        right_column: id

custom_instructions: |
  - movement_direction = 'DEBIT' means expense/outflow; 'CREDIT' means income/inflow.
  - Tag names are in Spanish (e.g. Supermercado, Transporte, Restaurantes, Salud, Suscripciones). When the user asks about a category in English, map it to the corresponding Spanish tag name.
  - To query all transactions across bank + credit card, UNION ALL account_movements and credit_card_movements.
  - Always join to tags to get human-readable category names.
  - Join account_movements to accounts for currency and account alias.
  - Use DATE_TRUNC and EXTRACT for date grouping. Use interval arithmetic for relative dates.
  - amount is always positive; use movement_direction to distinguish expenses from income.
  - CURRENCY CONVERSION: historical_exchange_rates stores rates as "1 USD = <rate> <target>".
    To convert a non-USD amount to USD: amount / rate.
    To convert USD to another currency: amount * rate.
    JOIN on rated_on = issued_at::date AND target_currency = <the non-USD currency>.
    If no exact date match exists, use latest_exchange_rates_mv as fallback via COALESCE.
  - Do NOT invent table names for exchange rates or currencies. The ONLY tables with rate data are historical_exchange_rates and latest_exchange_rates_mv.

verified_queries:
  - question: How much did I spend last month?
    sql: |
      SELECT SUM(am.amount) AS total_spent
      FROM account_movements am
      WHERE am.movement_direction = 'DEBIT'
        AND am.issued_at >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 month')
        AND am.issued_at < DATE_TRUNC('month', CURRENT_DATE)
  - question: What are my top spending categories this year?
    sql: |
      SELECT t.name AS category, SUM(am.amount) AS total
      FROM account_movements am
      LEFT JOIN tags t ON am.category_id = t.id
      WHERE am.movement_direction = 'DEBIT'
        AND am.issued_at >= DATE_TRUNC('year', CURRENT_DATE)
      GROUP BY t.name
      ORDER BY total DESC
  - question: Show my monthly income for the last 6 months
    sql: |
      SELECT DATE_TRUNC('month', am.issued_at) AS month, SUM(am.amount) AS total_income
      FROM account_movements am
      WHERE am.movement_direction = 'CREDIT'
        AND am.issued_at >= CURRENT_DATE - INTERVAL '6 months'
      GROUP BY DATE_TRUNC('month', am.issued_at)
      ORDER BY month
  - question: How much did I spend last month in USD? (account currency is UYU)
    sql: |
      SELECT SUM(am.amount / COALESCE(her.rate, ler.rate)) AS total_spent_usd
      FROM account_movements am
      JOIN accounts a ON am.account_id = a.id
      LEFT JOIN historical_exchange_rates her
        ON her.rated_on = am.issued_at::date
        AND her.source_currency = 'USD'
        AND her.target_currency = a.currency
      LEFT JOIN latest_exchange_rates_mv ler
        ON ler.target_currency = a.currency
      WHERE am.movement_direction = 'DEBIT'
        AND a.currency = 'UYU'
        AND am.issued_at >= DATE_TRUNC('month', CURRENT_DATE - INTERVAL '1 month')
        AND am.issued_at < DATE_TRUNC('month', CURRENT_DATE)
